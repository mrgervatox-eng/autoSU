# Copy to config.toml and edit. config.toml is gitignored so the API key stays local.

[llm]
model = "claude-opus-5-5"   # cheaper option: "claude-sonnet-5-5"
api_key = ""          # empty = use ANTHROPIC_API_KEY env var or an `ant auth login` profile
fake_mode = true      # true = mock LLM + simulated sensors (no network, no phones)
effort = "low"        # low | medium | high | xhigh | max  (thinking can't be turned off on these models)
max_tokens = 16000    # thinking tokens count toward this
max_repairs = 1       # extra calls allowed to fix an invalid reply (hard cap 2)
timeout_s = 60
refusal_fallback = true   # re-run a safety-classifier refusal on a fallback model (Claude API only)

[server]
host = "127.0.0.1"    # "0.0.0.0" exposes it to your network (needed for phones later)
port = 8000
allow_live = false    # true lets anyone who can open the dashboard start real-Claude runs (costs credit)

[data]
flights_csv = "flights.csv"            # full 2015 DOT file (gitignored)
scenario_path = "data/scenario.json"   # generated seed scenario (small, committed)

[limits]
max_rounds = 3
max_human_rejections = 2
decision_timeout_s = 60

# SIMULATED safety margins for the hackathon scenario. Not real-world standards.
[margins]
min_separation_sec = 120
fuel_reserve_kg = 1800.0
max_hold_min = 30
max_duty_min = 780
max_turbulence_index = 0.6
max_standing_water_mm = 3.0
min_observation_confidence = 0.6
